<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    
    , initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Form pemesanan pizza</h1>
    <p>
        silahkan isi form dibawah ini untuk memesan pizza sesuai dengan keinginan anda
    </p>

    <form action="http://www.blackgoosebistro.com/pizza.php" method="post">
        <fieldset>
            <legend>informasi pemesanan</legend>
            <p>
                <label for="customername">Nama :</label>
                <input type="text" id="customername" name="customername" required>
            </p>

            <p>
                <label for="customeraddress">Alamat :</label>
                <input type="text" id="customeraddress" name="customeraddress" required>
            </p>

            <p>
                <label for="customeraddress">telepon :</label>
                <input type="text" id="customeraddress" name="customeraddress" required>
            </p>

            <p>
                <label for="customeraddress">email :</label>
                <input type="email" id="customeraddress" name="customeraddress" required>
            </p>

            <p>
                <label for="intruction">delivery instructions:</label><br>
                <textarea
                    id="intruction" 
                    name="intruction" 
                    rows="4" 
                    cols="50"
                    maxlength="200"  
                    placeholder="no more than 400 character"></textarea>              
            </p>
        </fieldset>

        <fieldset>
            <legend>design your pizza</legend>
            <p><strong>Choose your size:</strong></p>
            <p>pilih salah satu ukuran pizza yang tersedia</p>

            <p>
                <input type="radio" id="classic" name="crust" value="classic white" required>
                <label for="classic">Classic White</label><br>

                <input type="radio" id="thin" name="crust" value="thin crust">
                <label for="thin">Thin Crust</label><br>

                <input type="radio" id="deepdish" name="crust" value="deep dish">
                <label for="deepdish">Deep Dish</label><br>

                <input type="radio" id="glutenfree" name="crust" value="gluten free">
                <label for="glutenfree">Gluten Free</label><br>
            </p>


            <p>pilih salah satu topping yang tersedia</p>
           <p>
                <input type="checkbox" id="classic" name="toppings" value="red sauce" required>
                <label for="classic">red sauce</label><br>

                <input type="checkbox" id="thin" name="toppings" value="white sauce">
                <label for="thin">white sauce</label><br>

                <input type="checkbox" id="deepdish" name="toppings" value="cheese">
                <label for="deepdish">cheese</label><br>

                <input type="checkbox" id="glutenfree" name="toppings" value="moozarella sauce">
                <label for="glutenfree">mozarella sauce</label><br>
           </p>

           <p>
                <label for="quantity">quantity :</label>
                <select id="quantity" name="quantity">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
           </p>
        </fieldset>

        <p>
            <input type="submit" value="submit">
            <input type="reset" value="reset">
        </p>
    </form>
    
</body>
</html>
